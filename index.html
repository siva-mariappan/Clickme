<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== Primary SEO ===== -->
  <title>Never Give Up — Daily Motivation | No Pain No Gain</title>
  <meta name="description" content="A quick shot of motivation: Never Give Up, No Pain, No Gain. Click the button for your daily reminder to keep pushing toward your goals.">
  <meta name="keywords" content="motivation, never give up, no pain no gain, daily motivation, gym quotes, inspiration">
  <meta name="author" content="Sivam">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#764ba2">

  <!-- Update this to your live GitHub Pages URL after deploy -->
  <link rel="canonical" href="https://siva-mariappan.github.io/Clickme/">

  <!-- ===== Open Graph (Facebook, LinkedIn, WhatsApp) ===== -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Never Give Up — Daily Motivation">
  <meta property="og:description" content="Never Give Up, No Pain, No Gain. Click for your daily reminder to keep pushing.">
  <meta property="og:url" content="https://siva-mariappan.github.io/Clickme/">
  <meta property="og:site_name" content="Daily Motivation">

  <!-- ===== Twitter / X Card ===== -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Never Give Up — Daily Motivation">
  <meta name="twitter:description" content="Never Give Up, No Pain, No Gain. Click for your daily reminder to keep pushing.">

  <!-- ===== Favicon (inline emoji, no extra file needed) ===== -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">

  <!-- ===== Structured Data (JSON-LD) ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Never Give Up — Daily Motivation",
    "description": "Never Give Up, No Pain, No Gain. A daily motivation reminder page.",
    "url": "https://siva-mariappan.github.io/Clickme/",
    "inLanguage": "en"
  }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .trigger {
      padding: 16px 40px;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      background: #ff5722;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .trigger:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }
    .trigger:active { transform: translateY(0); }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 80, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }
    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Card */
    .modal {
      width: min(90vw, 520px);
      background: #f7f8fa;
      border-radius: 28px;
      padding: 40px 44px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      transform: translateY(20px) scale(0.97);
      transition: transform 0.28s cubic-bezier(0.34,1.3,0.64,1);
    }
    .overlay.open .modal {
      transform: translateY(0) scale(1);
    }
    .modal h2 {
      margin: 0 0 28px;
      font-size: 30px;
      font-weight: 800;
      color: #1e2233;
      letter-spacing: -0.5px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 0;
    }
    .item + .item {
      border-top: 1px solid #e6e8ee;
    }
    .icon {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ece9fb;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 24px; height: 24px; stroke: #6c47d6; }
    .item span {
      font-size: 19px;
      font-weight: 600;
      color: #2a2e42;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 28px;
    }
    .ok {
      padding: 15px 42px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: #2c3ae0;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(44,58,224,0.4);
      transition: background 0.15s, transform 0.15s;
    }
    .ok:hover { background: #1f2bc0; transform: translateY(-2px); }
    .ok:active { transform: translateY(0); }
  </style>
</head>
<body>
  <button class="trigger" onclick="showMessage()">Click Me</button>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">This page says</h2>

      <div class="item">
        <div class="icon">
          <!-- flexed bicep / strength (lucide biceps-flexed) -->
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.409 13.017A5 5 0 0 1 22 15c0 3.866-4 7-9 7-4.077 0-8.153-.82-10.371-2.462-.426-.316-.631-.832-.62-1.362C2.118 12.723 2.627 2 10 2a3 3 0 0 1 3 3 2 2 0 0 1-2 2c-1.105 0-1.64-.444-2-1"/>
            <path d="M15 14a5 5 0 0 0-7.584 2"/>
            <path d="M9.964 6.825C8.019 7.977 9.5 13 8 15"/>
          </svg>
        </div>
        <span>Never Give Up</span>
      </div>

      <div class="item">
        <div class="icon">
          <!-- heartbeat -->
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 6.6a5 5 0 0 0-8.8-2 5 5 0 0 0-8.8 2c-1 2.5.4 5 2 6.6l6.8 6.8 6.8-6.8c1.6-1.6 3-4.1 2-6.6z"/>
            <path d="M3.5 12h4l1.5-3 2 5 1.5-2h4.5"/>
          </svg>
        </div>
        <span>No Pain</span>
      </div>

      <div class="item">
        <div class="icon">
          <!-- trophy -->
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/>
            <path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/>
          </svg>
        </div>
        <span>No Gain</span>
      </div>

      <div class="actions">
        <button class="ok" onclick="closeMessage()">Click Me</button>
      </div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');

    function showMessage() {
      overlay.classList.add('open');
    }
    function closeMessage() {
      overlay.classList.remove('open');
    }
    // close when clicking outside the card or pressing Escape
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeMessage();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMessage();
    });
  </script>
</body>
</html>
